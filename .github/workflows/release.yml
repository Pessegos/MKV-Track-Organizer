name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: .\build_exe.ps1 -SkipInstall

      - name: Smoke test packaged application
        shell: pwsh
        run: .\smoke_test_exe.ps1

      - name: Set release metadata
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
            $appVersion = (python -c "from app_metadata import APP_VERSION; print(APP_VERSION)").Trim()
            if ($releaseTag -ne "v$appVersion") {
              throw "Tag $releaseTag does not match APP_VERSION $appVersion."
            }
            $releaseTitle = "MKV Track Organizer $releaseTag"
            $releasePrerelease = "false"
            $releaseAsset = "dist\MKV Track Organizer-$releaseTag-win-x64.zip"
            $releaseNotes = ""
            $releaseNotesFile = ".github\release-notes\$releaseTag.md"
            if (-not (Test-Path -LiteralPath $releaseNotesFile)) {
              $releaseNotesFile = ""
            }
          } else {
            $releaseTag = "latest-dev"
            $releaseTitle = "MKV Track Organizer latest dev"
            $releasePrerelease = "true"
            $releaseAsset = "dist\MKV Track Organizer-latest-dev-win-x64.zip"
            $releaseNotes = "Automatic development build from commit ${{ github.sha }}."
            $releaseNotesFile = ""
          }

          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          echo "RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV
          echo "RELEASE_PRERELEASE=$releasePrerelease" >> $env:GITHUB_ENV
          echo "RELEASE_ASSET=$releaseAsset" >> $env:GITHUB_ENV
          echo "RELEASE_NOTES=$releaseNotes" >> $env:GITHUB_ENV
          echo "RELEASE_NOTES_FILE=$releaseNotesFile" >> $env:GITHUB_ENV

      - name: Package executable folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MKV Track Organizer\*" -DestinationPath "$env:RELEASE_ASSET" -Force

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -eq "latest-dev") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest-dev "${{ github.sha }}"
            git push origin refs/tags/latest-dev --force
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG "$env:RELEASE_ASSET" --clobber
            if ($env:RELEASE_PRERELEASE -eq "true") {
              gh release edit $env:RELEASE_TAG --title "$env:RELEASE_TITLE" --notes "$env:RELEASE_NOTES" --prerelease
            }
          } else {
            if ($env:RELEASE_PRERELEASE -eq "true") {
              gh release create $env:RELEASE_TAG "$env:RELEASE_ASSET" --title "$env:RELEASE_TITLE" --notes "$env:RELEASE_NOTES" --prerelease --latest=false --target "${{ github.sha }}"
            } else {
              $createArgs = @("release", "create", $env:RELEASE_TAG, $env:RELEASE_ASSET, "--title", $env:RELEASE_TITLE)
              if ($env:RELEASE_NOTES_FILE) {
                $createArgs += @("--notes-file", $env:RELEASE_NOTES_FILE)
              } else {
                $createArgs += "--generate-notes"
              }
              gh @createArgs
            }
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
