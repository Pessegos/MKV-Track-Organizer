name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: .\build_exe.ps1 -SkipInstall

      - name: Package executable folder
        shell: pwsh
        run: |
          $asset = "dist\MKV Track Organizer-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path "dist\MKV Track Organizer\*" -DestinationPath $asset -Force
          echo "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$env:RELEASE_ASSET" --clobber
          } else {
            gh release create $tag "$env:RELEASE_ASSET" --title "MKV Track Organizer $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
